name: gmi-descarga-local

services:
  php:
    build:
      context: ../..
      dockerfile: .docker/local/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ../../:/var/www/html
    environment:
     
      app.baseURL: "http://localhost:${APP_PORT:-8092}/"
      app.forceGlobalSecureRequests: "false"
      cookie.secure: "false"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "127.0.0.1:${APP_PORT:-8092}:80"
    volumes:
      - ../../:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  assets:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ../../:/workspace
      - node_modules:/workspace/node_modules
    command: ["sh", "-c", "npm ci --ignore-scripts && npm run build"]

volumes:
  node_modules:
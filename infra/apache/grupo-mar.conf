<VirtualHost *:80>
    ServerName descarga.local
    DocumentRoot /var/www/grupo-mar/public

    <Directory /var/www/grupo-mar/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /var/www/grupo-mar>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/grupo-mar-error.log
    CustomLog ${APACHE_LOG_DIR}/grupo-mar-access.log combined
</VirtualHost>
